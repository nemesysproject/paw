<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Crear Cuenta - Rescate Mascotas</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script type="module" src="/src/register.ts" defer></script>
  </head>

  <body>
    <main class="auth-container">
      <div class="auth-card">
        <i class="ph ph-paw-print auth-logo"></i>
        <h1 class="auth-title">Crear Cuenta</h1>
        <p class="auth-subtitle">Únete a la comunidad de rescate</p>

        <form class="auth-form" id="register-form">
          <div class="form-group">
            <label for="fullname">Nombre Completo</label>
            <div class="input-icon-wrapper">
              <i class="ph ph-user"></i>
              <input type="text" id="fullname" placeholder="Tu nombre" required />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <div class="input-icon-wrapper">
              <i class="ph ph-envelope-simple"></i>
              <input type="email" id="email" placeholder="tu@correo.com" required />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-icon-wrapper">
              <i class="ph ph-lock-key"></i>
              <input type="password" id="password" placeholder="••••••••" required />
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirmar Contraseña</label>
            <div class="input-icon-wrapper">
              <i class="ph ph-lock-key"></i>
              <input type="password" id="confirm-password" placeholder="••••••••" required />
            </div>
            <span id="password-error" style="color: var(--status-lost); font-size: 0.8rem; display: none;">Las contraseñas no coinciden</span>
          </div>

          <button type="submit" class="btn-primary">Registrarse</button>
        </form>

        <div class="auth-footer">
          ¿Ya tienes una cuenta? <a href="/login.html" class="auth-link">Inicia sesión</a>
        </div>
      </div>
    </main>
  </body>
</html>
